name: Pulse
options:
  bundleIdPrefix: com.chapaev12241
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '2.1.0'
    CURRENT_PROJECT_VERSION: '14'
packages:
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.10549.0
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
        excludes: [native-bridge.js, MacAssets.xcassets]
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes: [audio]
        NSMotionUsageDescription: Блики на стеклянных панелях Pulse двигаются при наклоне iPhone. Данные движения не сохраняются и не отправляются.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chapaev12241.pulsemusic
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PulseMac:
    type: application
    platform: macOS
    sources:
      - path: Pulse
        excludes: [native-bridge.js, Assets.xcassets]
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.chapaev12241.pulsemusic.mac
        PRODUCT_MODULE_NAME: PulseMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: '-'
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PulseTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pulse
  PulseMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PulseTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: '-'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Pulse.app/Contents/MacOS/Pulse'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: PulseMac
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    test:
      targets: [PulseTests]
  PulseMac:
    build:
      targets:
        PulseMac: all
        PulseMacTests: [test]
    test:
      targets: [PulseMacTests]

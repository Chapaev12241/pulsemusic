name: Pulse
options:
  bundleIdPrefix: com.chapaev12241
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: com.chapaev12241.pulsemusic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
        excludes: [native-bridge.js]
      - path: Pulse/native-bridge.js
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Pulse:
    build:
      targets:
        Pulse: all

name: Pulse Import Bot
on:
  push:
    branches: [main]
    paths: ['import-bot/**', '.github/workflows/import-bot.yml']
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: pulse-import-bot
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test importer
        run: node --test import-bot/test.mjs
      - name: Check public source downloads
        if: github.event_name == 'push'
        continue-on-error: true
        run: node import-bot/probe.mjs
      - name: Process queued imports
        run: node import-bot/runner.mjs

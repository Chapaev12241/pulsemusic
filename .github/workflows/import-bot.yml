name: Pulse Import Bot
on:
  push:
    branches: [main]
    paths: ['import-bot/**', '.github/workflows/import-bot.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: Run optional public-source diagnostics
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: pulse-import-bot
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: import-bot/package-lock.json
      - name: Install pinned browser metadata runtime
        run: npm ci --prefix import-bot --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pulse-spotify-chromium-1.65.1-${{ runner.os }}
      - name: Install Chromium for public playlist pages
        run: ./import-bot/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Test importer
        run: node --test import-bot/test.mjs import-bot/open-media.test.mjs import-bot/catalog.test.mjs import-bot/selection.test.mjs import-bot/playlist-transfer.test.mjs import-bot/recording.test.mjs import-bot/recording-resolver.test.mjs import-bot/spotify-browser.test.mjs
      - name: Check public source downloads
        if: github.event_name == 'workflow_dispatch' && inputs.probe == true
        continue-on-error: true
        run: node import-bot/probe.mjs
      - name: Process queued imports
        run: node import-bot/runner.mjs

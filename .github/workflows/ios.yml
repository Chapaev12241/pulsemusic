name: Apple apps
on:
  push:
    paths: ['ios/**', 'scripts/download-ai-model.mjs', 'scripts/prepare-ios-icons.mjs', 'scripts/test-mac-icon.swift', 'docs/icons/pulse-mac.*', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: pulse-apple-apps-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate icons
        run: node scripts/prepare-ios-icons.mjs
      - name: Check rounded Mac icons
        run: xcrun swift scripts/test-mac-icon.swift
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iPhone device
        working-directory: ios
        run: xcodebuild -project Pulse.xcodeproj -scheme Pulse -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device-check CODE_SIGNING_ALLOWED=NO build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pulse-ai
          key: pulse-qwen-native-v2-${{ runner.arch }}
      - name: Download verified local AI model
        run: node scripts/download-ai-model.mjs --directory "$HOME/.cache/pulse-ai"
      - name: Build and test Mac app
        working-directory: ios
        run: xcodebuild -project Pulse.xcodeproj -scheme PulseMac -configuration Debug -destination 'platform=macOS' -derivedDataPath build-tests test
      - name: Build universal Mac app
        working-directory: ios
        run: |
          xcodebuild -project Pulse.xcodeproj -scheme PulseMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build-mac ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          codesign --force --deep --sign - build-mac/Build/Products/Release/Pulse.app
          ditto -c -k --sequesterRsrc --keepParent build-mac/Build/Products/Release/Pulse.app Pulse-Mac.zip
          mkdir -p MacPackage
          ditto build-mac/Build/Products/Release/Pulse.app MacPackage/Pulse.app
          ln -s /Applications MacPackage/Applications
          hdiutil create -volname Pulse -srcfolder MacPackage -ov -format UDZO Pulse-Mac.dmg
      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          xcodebuild -project Pulse.xcodeproj -scheme Pulse -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/Pulse.app package/Payload/
          cd package
          zip -qry ../Pulse-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Mac
          path: |
            ios/Pulse-Mac.zip
            ios/Pulse-Mac.dmg
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-iPhone-unsigned
          path: ios/Pulse-unsigned.ipa
          retention-days: 14
